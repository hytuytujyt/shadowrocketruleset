name: Update Shadowrocket Rules

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sing-box
        run: |
          curl -fsSL https://sing-box.app/install.sh | sh

      - name: Download geosite source
        run: |
          mkdir -p rules

          curl -L https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-bybit.srs \
          -o bybit.srs

          curl -L https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/binance.srs \
          -o binance.srs

      - name: Convert rules
        run: |
          git clone --depth 1 https://github.com/SagerNet/sing-geosite.git

          mkdir -p rules

          python3 - <<'PY'
          import os

          def convert(src, dst):
              with open(src, "rb") as f:
                  data = f.read()

              domains = []
              text = data.decode("utf-8", errors="ignore")

              for line in text.splitlines():
                  line = line.strip()
                  if "." in line and not line.startswith("#"):
                      domains.append(line)

              with open(dst, "w") as f:
                  for d in sorted(set(domains)):
                      f.write("DOMAIN-SUFFIX," + d + "\n")

          convert("bybit.srs", "rules/Bybit.list")
          convert("binance.srs", "rules/Binance.list")
          PY

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git commit -m "Update Shadowrocket rules" || exit 0
          git push