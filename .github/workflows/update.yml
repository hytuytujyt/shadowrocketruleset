name: Update Shadowrocket Rules

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sing-box
        run: |
          curl -fsSL https://sing-box.app/install.sh | sh

      - name: Download geosite source
        run: |
          mkdir -p rules

          curl -L https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-bybit.srs \
          -o bybit.srs

          curl -L https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/binance.srs \
          -o binance.srs

      - name: Convert rules
        run: |
          mkdir -p rules

          sing-box rule-set decompile bybit.srs -o bybit.json
          sing-box rule-set decompile binance.srs -o binance.json

          python3 <<'PY'
          import json

          def convert(src, dst):
              with open(src, "r", encoding="utf-8") as f:
                  data = json.load(f)

              domains = []

              def walk(obj):
                  if isinstance(obj, dict):
                      for k, v in obj.items():
                          if k == "domain_suffix":
                              domains.extend(v)
                          else:
                              walk(v)
                  elif isinstance(obj, list):
                      for x in obj:
                          walk(x)

              walk(data)

              with open(dst, "w", encoding="utf-8") as f:
                  for d in sorted(set(domains)):
                      f.write(f"DOMAIN-SUFFIX,{d}\n")

          convert("bybit.json", "rules/Bybit.list")
          convert("binance.json", "rules/Binance.list")
          PY

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git commit -m "Update Shadowrocket rules" || exit 0
          git push